      <stop offset="100%" stop-color="#E4FF5C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig-b" cx="0.5" cy="0.5" r="0.78">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">

  <defs>
    <linearGradient id="sky-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#153a4e"/>
      <stop offset="100%" stop-color="#2c6a52"/>
    </linearGradient>
    <linearGradient id="floor-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C7A3F"/>
      <stop offset="100%" stop-color="#2a4a22"/>
    </linearGradient>
    <radialGradient id="bloom-b" cx="0.5" cy="0.28" r="0.55">

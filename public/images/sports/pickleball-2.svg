<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">

  <defs>
    <linearGradient id="sky-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E2621"/>
      <stop offset="100%" stop-color="#123029"/>
    </linearGradient>
    <linearGradient id="floor-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a6d5c"/>
      <stop offset="100%" stop-color="#153f36"/>
    </linearGradient>
    <radialGradient id="bloom-b" cx="0.5" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#E4FF5C" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#E4FF5C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig-b" cx="0.5" cy="0.5" r="0.78">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain-b" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
    <filter id="soft-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#sky-b)"/>
  <rect width="800" height="600" fill="url(#bloom-b)"/>

  <!-- close crop: paddle + ball resting on the kitchen line -->
  <polygon points="0.0,300.0 800.0,250.0 800.0,600.0 0.0,600.0" fill="url(#floor-b)" />
  <rect x="0" y="0" width="800" height="310" fill="#0b1f1b" opacity="0.5"/>
  <line x1="0" y1="300" x2="800" y2="250" stroke="#F4F1E8" stroke-width="3" opacity="0.5"/>
  <line x1="0" y1="418" x2="800" y2="368" stroke="#F4F1E8" stroke-width="7" opacity="0.9"/>
  <line x1="470" y1="393" x2="520" y2="600" stroke="#F4F1E8" stroke-width="6" opacity="0.75"/>
  <!-- paddle -->
  <g transform="translate(250 372) rotate(-14)">
    <rect x="-8" y="70" width="26" height="96" rx="12" fill="#1a1410"/>
    <rect x="-4" y="76" width="18" height="70" rx="9" fill="#2a211a"/>
    <rect x="-62" y="-72" width="134" height="152" rx="30" fill="#12312a" stroke="#E4FF5C" stroke-width="4"/>
    <rect x="-50" y="-60" width="110" height="128" rx="22" fill="#0f2a24" opacity="0.9"/>
    <circle cx="5" cy="4" r="30" fill="#E4FF5C" opacity="0.10"/>
    <text x="5" y="12" font-family="monospace" font-size="19" font-weight="700" fill="#E4FF5C" text-anchor="middle" opacity="0.85">CTX</text>
  </g>
  <!-- ball with holes -->
  <g transform="translate(556 404)">
    <ellipse cx="6" cy="60" rx="46" ry="11" fill="#000" opacity="0.35"/>
    <circle r="52" fill="#E4FF5C"/>
    <circle r="52" fill="none" stroke="#0E1512" stroke-width="2" opacity="0.25"/>
    <circle cx="-24" cy="-20" r="7" fill="#0E1512" opacity="0.42"/><circle cx="2" cy="-30" r="7" fill="#0E1512" opacity="0.42"/><circle cx="26" cy="-14" r="7" fill="#0E1512" opacity="0.42"/><circle cx="-28" cy="8" r="7" fill="#0E1512" opacity="0.42"/><circle cx="-4" cy="2" r="7" fill="#0E1512" opacity="0.42"/><circle cx="22" cy="14" r="7" fill="#0E1512" opacity="0.42"/><circle cx="-16" cy="32" r="7" fill="#0E1512" opacity="0.42"/><circle cx="12" cy="36" r="7" fill="#0E1512" opacity="0.42"/>
    <path d="M-38,-30 A52,52 0 0 1 0,-50" stroke="#F4F1E8" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>
  <rect width="800" height="600" fill="url(#vig-b)"/>
  <rect width="800" height="600" filter="url(#grain-b)" opacity="0.5"/>
</svg>

    </filter>
    <filter id="soft-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#sky-b)"/>
  <rect width="800" height="600" fill="url(#bloom-b)"/>


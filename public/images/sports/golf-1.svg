<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">

  <defs>
    <linearGradient id="sky-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08130f"/>
      <stop offset="100%" stop-color="#0d2019"/>
    </linearGradient>
    <linearGradient id="floor-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f7a3a"/>
      <stop offset="100%" stop-color="#1c3016"/>
    </linearGradient>
    <radialGradient id="bloom-a" cx="0.5" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#E4FF5C" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#E4FF5C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig-a" cx="0.5" cy="0.5" r="0.78">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain-a" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
    <filter id="soft-a" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#sky-a)"/>
  <rect width="800" height="600" fill="url(#bloom-a)"/>

  <!-- simulator bay: projected fairway on an impact screen -->
  <rect x="0" y="0" width="800" height="600" fill="#08130f"/>
  <!-- screen -->
  <rect x="64" y="40" width="672" height="392" rx="6" fill="#0d2a20"/>
  <clipPath id="screen-a"><rect x="64" y="40" width="672" height="392" rx="6"/></clipPath>
  <g clip-path="url(#screen-a)">
    <rect x="64" y="40" width="672" height="196" fill="#1d4f6e"/>
    <rect x="64" y="40" width="672" height="196" fill="url(#bloom-a)"/>
    <circle cx="620" cy="106" r="34" fill="#E4FF5C" opacity="0.45"/>
    <path d="M64,236 Q220,200 400,214 Q580,228 736,196 L736,432 L64,432 Z" fill="#3f7a3a"/>
    <path d="M64,286 Q240,254 420,270 Q600,286 736,252 L736,432 L64,432 Z" fill="#4C7A3F"/>
    <path d="M180,432 Q300,300 400,286 Q500,300 620,432 Z" fill="#5f9b4e" opacity="0.85"/>
    <ellipse cx="400" cy="292" rx="52" ry="13" fill="#6fb35a"/>
    <ellipse cx="286" cy="336" rx="34" ry="14" fill="#c8b98d" opacity="0.8"/>
    <ellipse cx="516" cy="352" rx="40" ry="15" fill="#c8b98d" opacity="0.7"/>
    <path d="M90,236 l-13,-30 l13,-8 l13,8 z" fill="#1f4a22" opacity="0.55"/><path d="M172,236 l-13,-30 l13,-8 l13,8 z" fill="#1f4a22" opacity="0.55"/><path d="M254,236 l-13,-30 l13,-8 l13,8 z" fill="#1f4a22" opacity="0.55"/><path d="M336,236 l-13,-30 l13,-8 l13,8 z" fill="#1f4a22" opacity="0.55"/><path d="M418,236 l-13,-30 l13,-8 l13,8 z" fill="#1f4a22" opacity="0.55"/><path d="M500,236 l-13,-30 l13,-8 l13,8 z" fill="#1f4a22" opacity="0.55"/><path d="M582,236 l-13,-30 l13,-8 l13,8 z" fill="#1f4a22" opacity="0.55"/><path d="M664,236 l-13,-30 l13,-8 l13,8 z" fill="#1f4a22" opacity="0.55"/><path d="M746,236 l-13,-30 l13,-8 l13,8 z" fill="#1f4a22" opacity="0.55"/>
    <!-- pin -->
    <line x1="400" y1="290" x2="400" y2="236" stroke="#F4F1E8" stroke-width="2.5"/>
    <path d="M400,236 L432,246 L400,256 Z" fill="#E4572E"/>
    <circle cx="400" cy="291" r="4" fill="#123" opacity="0.6"/>
    <!-- shot tracer -->
    <path d="M400,424 Q400,222 400,290" stroke="#E4FF5C" stroke-width="2.5" fill="none" opacity="0.5" stroke-dasharray="6 8"/>
  </g>
  <rect x="64" y="40" width="672" height="392" rx="6" fill="none" stroke="#F4F1E8" stroke-width="3" opacity="0.35"/>
  <!-- HUD readout -->
  <g font-family="monospace" font-size="15" fill="#E4FF5C">
    <rect x="88" y="62" width="196" height="94" rx="8" fill="#04100d" opacity="0.72"/>
    <text x="104" y="86" opacity="0.55" font-size="11">CARRY</text><text x="196" y="86">212 yd</text>
    <text x="104" y="112" opacity="0.55" font-size="11">BALL SPD</text><text x="196" y="112">148 mph</text>
    <text x="104" y="138" opacity="0.55" font-size="11">LAUNCH</text><text x="196" y="138">14.2°</text>
  </g>
  <!-- hitting mat -->
  <polygon points="64.0,432.0 736.0,432.0 800.0,600.0 0.0,600.0" fill="#2f5c2c" />

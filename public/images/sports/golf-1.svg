ne x1="658" y1="432" x2="704" y2="600" stroke="#1f4a22" stroke-width="2" opacity="0.5"/><line x1="685" y1="432" x2="736" y2="600" stroke="#1f4a22" stroke-width="2" opacity="0.5"/><line x1="712" y1="432" x2="768" y2="600" stroke="#1f4a22" stroke-width="2" opacity="0.5"/><line x1="739" y1="432" x2="800" y2="600" stroke="#1f4a22" stroke-width="2" opacity="0.5"/>
  <rect x="300" y="470" width="200" height="70" rx="6" fill="#3f7a3a" stroke="#F4F1E8" stroke-width="2" opacity="0.9"/>
  <!-- tee + ball -->
  <line x1="400" y1="486" x2="400" y2="504" stroke="#F4F1E8" stroke-width="4"/>
  <circle cx="400" cy="478" r="14" fill="#F4F1E8"/>
  <circle cx="395" cy="473" r="1.9" fill="#0E1512" opacity="0.25"/><circle cx="403" cy="472" r="1.9" fill="#0E1512" opacity="0.25"/><circle cx="394" cy="481" r="1.9" fill="#0E1512" opacity="0.25"/><circle cx="404" cy="481" r="1.9" fill="#0E1512" opacity="0.25"/><circle cx="400" cy="477" r="1.9" fill="#0E1512" opacity="0.25"/>
  <circle cx="400" cy="478" r="26" fill="#E4FF5C" opacity="0.18" filter="url(#soft-a)"/>
  <rect width="800" height="600" fill="url(#vig-a)"/>
  <rect width="800" height="600" filter="url(#grain-a)" opacity="0.5"/>
</svg>

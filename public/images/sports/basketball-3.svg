<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">

  <defs>
    <linearGradient id="sky-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081a16"/>
      <stop offset="100%" stop-color="#0e2621"/>
    </linearGradient>
    <linearGradient id="floor-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6b52"/>
      <stop offset="100%" stop-color="#17372c"/>
    </linearGradient>
    <radialGradient id="bloom-c" cx="0.5" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#E4FF5C" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#E4FF5C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig-c" cx="0.5" cy="0.5" r="0.78">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain-c" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
    <filter id="soft-c" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#sky-c)"/>
  <rect width="800" height="600" fill="url(#bloom-c)"/>

  <!-- covered outdoor court, side angle -->
  <rect x="0" y="0" width="800" height="270" fill="#0d1f1a"/>
